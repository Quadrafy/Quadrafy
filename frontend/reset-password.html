<!doctype html>
<html lang="pt-BR" data-page="auth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Redefina a senha da sua conta Padelfy." />
    <meta name="robots" content="noindex" />
    <title>Redefinir senha — Padelfy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="auth-page">
    <a
      class="brand brand--image auth-brand"
      href="index.html"
      aria-label="Voltar para a página inicial"
      ><span class="brand-logo-surface brand-logo-surface--login"
        ><img class="brand-logo brand-logo--full brand-logo--login" src="assets/images/padelfy-logo.png" alt="" width="1600" height="485"></span
    ></a>
    <main class="auth-layout">
      <section class="auth-showcase">
        <div class="auth-art">
          <span class="court-line line-a"></span
          ><span class="court-line line-b"></span
          ><span class="court-line line-c"></span>
          <div class="auth-ball"><i></i></div>
          <div class="auth-quote">
            <p>“Uma nova senha, o mesmo jogo de sempre.”</p>
            <span>Padelfy / Segurança</span>
          </div>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-view active" data-auth-view="reset">
            <div class="auth-heading">
              <p class="eyebrow dark">Redefinir senha</p>
              <h1>Crie sua<br /><em>nova senha.</em></h1>
              <p>Escolha uma senha forte para proteger sua conta.</p>
            </div>
            <form data-auth-form="reset-password">
              <input type="hidden" name="token" />
              <label class="input-group"
                ><span
                  >Nova senha
                  <small style="font-weight: 400; color: #888"
                    >(mín. 10 car., maiúscula, minúscula e número)</small
                  ></span
                ><input
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  minlength="10"
                  maxlength="128"
                  placeholder="Sua nova senha"
                  required
                /><button
                  class="password-toggle"
                  type="button"
                  data-password-toggle
                >
                  Mostrar
                </button></label
              >
              <button
                class="button button-primary button-block shine"
                type="submit"
              >
                Redefinir senha <span>→</span>
              </button>
              <p
                class="auth-feedback hidden"
                role="alert"
                aria-live="polite"
                data-auth-feedback
              ></p>
            </form>
            <p class="auth-note">
              <a href="login.html">← Voltar para o login</a>
            </p>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
