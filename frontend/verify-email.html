<!doctype html>
<html lang="pt-BR" data-page="verify">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Confirme seu e-mail na Padelfy." />
    <meta name="robots" content="noindex" />
    <title>Confirmar e-mail — Padelfy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Poppins:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="auth-page">
    <a
      class="brand brand--image auth-brand"
      href="index.html"
      aria-label="Voltar para a página inicial"
      ><span class="brand-logo-surface brand-logo-surface--login"
        ><img class="brand-logo brand-logo--full brand-logo--login" src="assets/images/padelfy-logo.png" alt="" width="1600" height="485"></span
    ></a>
    <main class="auth-layout">
      <section class="auth-showcase">
        <div class="auth-art">
          <span class="court-line line-a"></span
          ><span class="court-line line-b"></span
          ><span class="court-line line-c"></span>
          <div class="auth-ball"><i></i></div>
          <div class="auth-quote">
            <p>“Conta confirmada, quadra liberada.”</p>
            <span>Padelfy / Boas-vindas</span>
          </div>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-view active" data-verify-email>
            <div class="auth-heading">
              <p class="eyebrow dark">Confirmação de e-mail</p>
              <h1>Ativando sua<br /><em>conta.</em></h1>
            </div>
            <p class="auth-feedback" role="status" aria-live="polite" data-verify-status>
              Confirmando seu e-mail…
            </p>
            <p class="auth-note" style="margin-top: 18px">
              <a href="login.html">Ir para o login →</a>
            </p>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
